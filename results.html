<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Am I Larping? — Case Closed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0a;
    --pink: #ff2e93;
    --teal: #2dd9c4;
    --yellow: #ffcc00;
    --text: #f5f5f5;
    --muted: #7a7a7a;
    --card: #131313;
    --border: #232323;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hazard{
    width: 100%;
    height: 10px;
    background: repeating-linear-gradient(45deg, var(--yellow) 0 14px, #0a0a0a 14px 28px);
  }

  header{
    width: 100%;
    max-width: 640px;
    padding: 32px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .back-link{
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.05em;
    transition: color 0.2s;
  }
  .back-link:hover{ color: var(--text); }

  .case-tag{
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--teal);
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
  }
  .case-tag::before{
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
  }

  main{
    width: 100%;
    max-width: 560px;
    padding: 48px 24px 64px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .archetype-tag{
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .archetype-tag .emoji{ margin-right: 6px; }

  .score-label{
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .score-number{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(72px, 20vw, 120px);
    line-height: 1;
    color: var(--pink);
    margin-bottom: 8px;
  }

  .score-number .percent{
    font-size: 0.4em;
    vertical-align: super;
  }

  .verdict{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 4vw, 24px);
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .verdict-sub{
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 40px;
    max-width: 420px;
    line-height: 1.6;
  }

  .actions{
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .btn{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    padding: 16px 24px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
    text-decoration: none;
    display: block;
  }
  .btn:hover{ transform: scale(1.02); }

  .btn-primary{
    background: var(--pink);
    color: #0a0a0a;
    border: 2px solid var(--pink);
  }

  .btn-secondary{
    background: transparent;
    color: var(--teal);
    border: 2px solid var(--border);
  }
  .btn-secondary:hover{ border-color: var(--teal); }

  .status-line{
    font-size: 12px;
    color: var(--teal);
    letter-spacing: 0.06em;
    min-height: 16px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .status-line.visible{ opacity: 1; }

  .error-state{
    padding-top: 80px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.06em;
  }
  .error-state a{ color: var(--pink); }

  footer{
    padding: 24px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

  <div class="hazard"></div>

  <header>
    <a href="select-type.html" class="back-link">← NEW TEST</a>
    <div class="case-tag">CASE FILE #04,832 — CLOSED</div>
  </header>

  <main id="main">
    <!-- populated by JS -->
  </main>

  <footer>AM I LARPING? — THE INTERNET'S LEAST SCIENTIFIC AUTHENTICITY TEST</footer>

  <script>
    const ARCHETYPES = {
      'finance-bro':   { name: 'Finance Bro',   emoji: '📈' },
      'founder':       { name: 'Founder',       emoji: '🚀' },
      'gym-bro':       { name: 'Gym Bro',       emoji: '💪' },
      'international': { name: 'International', emoji: '✈️' },
      'that-girl':     { name: 'That Girl',     emoji: '🍵' },
      'influencer':    { name: 'Influencer',    emoji: '📸' }
    };

    const VERDICT_TIERS = [
      { min: 0,  max: 19,  label: 'CASE DISMISSED',              sub: 'Barely a whiff of performance here. Suspiciously well-adjusted.' },
      { min: 20, max: 39,  label: 'MOSTLY THE REAL DEAL',         sub: 'A little embellishment, nothing a jury would convict on.' },
      { min: 40, max: 59,  label: 'SOME PERFORMANCE DETECTED',    sub: 'The character is slipping through. We see you.' },
      { min: 60, max: 79,  label: 'EVIDENCE IS MOUNTING',         sub: 'This is no longer a bit. This is a lifestyle.' },
      { min: 80, max: 100, label: 'SEVERE LARP ACTIVITY DETECTED', sub: 'The algorithm has made its decision. There is no appeal.' }
    ];

    const params = new URLSearchParams(window.location.search);
    const typeSlug = params.get('type');
    const scoreParam = params.get('score');
    const mainEl = document.getElementById('main');

    function getVerdict(score){
      return VERDICT_TIERS.find(t => score >= t.min && score <= t.max) || VERDICT_TIERS[0];
    }

    function showError(){
      mainEl.innerHTML = `
        <div class="error-state">
          No case file found for this result.<br><br>
          <a href="select-type.html">← Start a new test</a>
        </div>
      `;
    }

    function animateCount(el, target){
      const duration = 1200;
      const start = performance.now();
      function tick(now){
        const elapsed = Math.min((now - start) / duration, 1);
        const eased = elapsed * (2 - elapsed);
        const current = Math.round(eased * target);
        el.textContent = current;
        if (elapsed < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function buildShareText(archetype, score, verdict){
      return `${archetype.emoji} I scored ${score}% on the ${archetype.name} LARP test.\n${verdict.label}\n\nTake the test: https://amilarping.com`;
    }

    async function shareResult(text){
      const statusLine = document.getElementById('statusLine');
      if (navigator.share){
        try {
          await navigator.share({ title: 'Am I Larping?', text, url: 'https://amilarping.com' });
          return;
        } catch (err){
          // user cancelled or share failed — fall through to clipboard
        }
      }
      try {
        await navigator.clipboard.writeText(text);
        statusLine.textContent = 'Copied to clipboard!';
        statusLine.classList.add('visible');
        setTimeout(() => statusLine.classList.remove('visible'), 2500);
      } catch (err){
        statusLine.textContent = 'Could not copy — select and copy manually.';
        statusLine.classList.add('visible');
      }
    }

    function init(){
      const score = parseInt(scoreParam, 10);
      const archetype = ARCHETYPES[typeSlug];

      if (!archetype || isNaN(score) || score < 0 || score > 100){
        showError();
        return;
      }

      const verdict = getVerdict(score);
      const shareText = buildShareText(archetype, score, verdict);

      mainEl.innerHTML = `
        <div class="archetype-tag"><span class="emoji">${archetype.emoji}</span>${archetype.name} ANALYSIS COMPLETE</div>

        <div class="score-label">Your LARP Score</div>
        <div class="score-number"><span id="scoreCount">0</span><span class="percent">%</span></div>

        <div class="verdict">🎭 ${verdict.label}</div>
        <div class="verdict-sub">${verdict.sub}</div>

        <div class="actions">
          <button class="btn btn-primary" id="shareBtn">SHARE MY RESULT</button>
          <a class="btn btn-secondary" href="select-type.html">TAKE ANOTHER TEST</a>
        </div>
        <div class="status-line" id="statusLine"></div>
      `;

      animateCount(document.getElementById('scoreCount'), score);
      document.getElementById('shareBtn').addEventListener('click', () => shareResult(shareText));
    }

    init();
  </script>

</body>
</html>
